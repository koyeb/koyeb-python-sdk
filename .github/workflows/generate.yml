name: generate

on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [swagger-updated]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Setup python
        uses: actions/setup-python@a26af69be991a21343d401cbd1fa4f9fef2efed1 # v5
      - name: Install tox
        run: python -m pip install tox bumpver
      - name: generate
        run: |
          make gen-api-client
          sudo chown -R $USER .
      - name: bump version
        run: |
          git config user.email noreply@github.com
          git config user.name GitHub
          bumpver update --patch -n
      - name: Format code using black
        uses: rickstaa/action-black@944ff59fef4e8a782ab66755472f6f111e6fcb41 # v1
        id: action_black
        with:
          black_args: "koyeb/ test/"
      - name: Run test suite
        run: tox
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@18f7dc018cc2cd597073088f7c7591b9d1c02672 # v3
        with:
          body: |
            Auto-generated by [create-pull-request]
